# Dependabot configuration.
#
# Goal: stay up to date without noisy, hard-to-test mega-PRs.
#  - New versions are only proposed once they are 14 days old (cooldown).
#  - Routine MINOR + PATCH bumps are batched into a single weekly PR.
#  - MAJOR bumps come as SEPARATE, individual PRs (one ecosystem-shift at a
#    time), because a major often needs companion bumps + a migration and must
#    be validated against the Windows build, not just CI.
#
# NOTE: tightly-coupled packages must move together (CI won't catch a partial
# bump's build break unless the build job runs — see .github/workflows/ci.yml):
#   - electron  <-> electron-builder <-> electron-vite
#   - vite      <-> @vitejs/plugin-react <-> vitest <-> @vitest/coverage-v8
#   - eslint    <-> typescript-eslint <-> eslint-plugin-react(-hooks)
#   - tailwindcss <-> @tailwindcss/postcss
# When reviewing a grouped/major PR, check the matching companion is included.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Supply-chain safety: never propose a version published less than 14 days
    # ago (time for a malicious or broken release to be spotted and pulled).
    # Applies to version updates only — SECURITY updates stay immediate.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # vitest and its plugins must move in lockstep (@vitest/coverage-v8 pins
      # the exact vitest version): one PR for all of them, majors included.
      # Listed first so these packages never land in the generic group.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Electron is capped at 41 — established empirically with better-sqlite3
      # 12.10.0, which failed to compile against Electron 42's V8
      # (v8::External::New/Value + SetNativeDataProperty API changes). Newer
      # better-sqlite3 releases may lift that limitation: when bumping
      # better-sqlite3, re-test the Electron major (electron-rebuild against 42)
      # before removing this ignore, bumping electron + electron-builder +
      # electron-vite together and validating the Windows build. Minor/patch
      # within 41.x are still taken.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      # @types/node must follow the Node version EMBEDDED in Electron (Electron
      # 41 → Node 24), not the latest Node: newer types would allow APIs that do
      # not exist at runtime. Bump the major together with Electron.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Preset 10 needs the new conventional-changelog generation: with the
      # installed semantic-release plugins (writer 8 / parser 6) the release
      # notes come out EMPTY (tested). Bump together with those plugins.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
