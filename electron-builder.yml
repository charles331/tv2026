# electron-builder configuration — Windows (NSIS .exe + portable) and Linux
# (.deb + AppImage) targets.
#
# IMPORTANT — native module + mpv:
#  * better-sqlite3 (13+) is the only native module. It ships N-API prebuilt
#    binaries for every OS (node_modules/better-sqlite3/prebuilds/*.node) that
#    load in any Electron version, so nothing is compiled (no postinstall
#    rebuild, `npmRebuild: false`, pnpm `neverBuiltDependencies`). asarUnpack
#    below keeps those .node files loadable from the packaged app.
#  * Linux packages (.deb + AppImage) are built on Linux (`pnpm package:linux`,
#    or the release-linux CI job); mpv comes from the distribution there.
#  * The mpv binary (mpv.exe + any required DLLs) is bundled from
#    resources/bin/win/ via extraResources below. mpv-player-integrator places
#    the Windows mpv build there. At runtime it resolves to
#    process.resourcesPath/bin/mpv.exe.

appId: io.github.charles331.tv2026
productName: TV2026
copyright: Copyright © 2026 charles331

directories:
  output: release
  buildResources: build

# Built JS from electron-vite lives in out/. Include package.json + node_modules
# (native better-sqlite3) — asarUnpack keeps the .node loadable.
files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  # Bundle the mpv Windows binary (placed by the CI "Bundle mpv" step). Windows
  # only: on Linux, mpv comes from the distribution (deb Recommends / PATH).
  extraResources:
    - from: resources/bin/win
      to: bin
      filter:
        - '**/*'
  # Multi-resolution app icon (build/icon.ico, 16→256). Used for the .exe, the
  # installed app, and shortcuts. build/ is the buildResources dir above, so this
  # is also picked up by convention, but we set it explicitly for clarity.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TV2026
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Linux (Ubuntu/Debian .deb + universal AppImage). Built on ubuntu-latest in CI
# (better-sqlite3 is native: it must be compiled on Linux). mpv is NOT bundled:
# the .deb recommends the distribution's mpv (apt installs it by default), the
# AppImage expects it on the PATH (`sudo apt install mpv`).
linux:
  icon: build/icon.png
  category: AudioVideo
  synopsis: Parcourir, télécharger et lire les films d'un fournisseur IPTV
  maintainer: charles331
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}

deb:
  artifactName: ${name}_${version}_amd64.${ext}
  # Lecture vidéo : apt installe les « Recommends » par défaut.
  recommends:
    - mpv

# No native rebuild: better-sqlite3 (13+, the only native module) ships N-API
# prebuilt binaries for every OS (prebuilds/<os>-<arch>.node) that load in any
# Electron version. Compiling it is unnecessary and fails on CI runners whose
# Visual Studio is newer than node-gyp knows (VS 2026 on windows-latest).
npmRebuild: false

# Where updates are published / fetched from. electron-updater reads the
# latest.yml of the GitHub Release to auto-update installed apps.
publish:
  provider: github
  owner: charles331
  repo: tv2026
